<!DOCTYPE html>
<html>
<head>
    <title>Pro Stock Terminal & Cockpit</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1115; color: #e1e3e6; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Left Sidebar */
        .sidebar { width: 270px; background: #171a21; border-right: 1px solid #262b36; display: flex; flex-direction: column; padding: 15px; }
        .sidebar h2 { font-size: 13px; text-transform: uppercase; color: #787e8e; margin-bottom: 12px; letter-spacing: 0.5px; }
        .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
        .search-box input { flex: 1; background: #0f1115; border: 1px solid #262b36; color: #fff; padding: 8px; border-radius: 6px; }
        .search-box button { background: #00d2ff; border: none; color: #000; font-weight: bold; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .watchlist { flex: 1; overflow-y: auto; list-style: none; padding: 0; margin: 0; }
        .watchlist-item { padding: 10px 12px; border-radius: 6px; background: #1e222d; margin-bottom: 8px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
        .watchlist-item:hover, .watchlist-item.active { border-color: #00d2ff; background: #252a37; }
        .watchlist-item .ticker { font-weight: bold; }
        .btn-delete { background: none; border: none; color: #ff4a4a; font-weight: bold; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        .btn-delete:hover { background: rgba(255, 74, 74, 0.2); }
        
        /* Main View */
        .main-content { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #171a21; padding: 12px 20px; border-radius: 10px; border: 1px solid #262b36; }
        .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        select, button.btn-control { background: #0f1115; border: 1px solid #262b36; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        button.btn-alert { background: #ff9900; color: #000; font-weight: bold; }
        
        /* Grid Metrics */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .card { background: #171a21; padding: 15px; border-radius: 10px; border: 1px solid #262b36; text-align: center; }
        .card h3 { font-size: 11px; color: #787e8e; margin: 0 0 6px 0; text-transform: uppercase; }
        .card p { font-size: 18px; font-weight: bold; margin: 0; color: #00d2ff; }
        
        /* Chart Canvas Container */
        .chart-container { flex: 1; background: #171a21; padding: 20px; border-radius: 10px; border: 1px solid #262b36; min-height: 420px; position: relative; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Watchlist</h2>
        <div class="search-box">
            <input type="text" id="addTickerInput" placeholder="Add symbol (e.g. MSFT)...">
            <button id="addBtn">+</button>
        </div>
        <ul class="watchlist" id="watchlistUI">
            <li class="watchlist-item active" data-symbol="YCA.L"><span class="ticker">YCA.L</span><button class="btn-delete">✕</button></li>
        </ul>
    </div>
    
    <div class="main-content">
        <div class="top-nav">
            <h2 id="activeTitle" style="margin:0;">YCA.L - Terminal View</h2>
            <div class="controls">
                <label>Timeframe:</label>
                <select id="timeframeSelect">
                    <option value="MAX">Forever (Max)</option>
                    <option value="5Y">5 Years</option>
                    <option value="4Y">4 Years</option>
                    <option value="3Y">3 Years</option>
                    <option value="2Y">2 Years</option>
                    <option value="1Y">1 Year</option>
                    <option value="9M">9 Months</option>
                    <option value="6M">6 Months</option>
                    <option value="3M">3 Months</option>
                    <option value="1M" selected>1 Month</option>
                    <option value="2W">2 Weeks</option>
                    <option value="1W">1 Week</option>
                    <option value="5D">5 Days</option>
                    <option value="1D">1 Day</option>
                </select>
                
                <label>Chart Style:</label>
                <select id="styleSelect">
                    <option value="line">Line Chart</option>
                    <option value="area">Area Chart</option>
                    <option value="bar">Bar Chart</option>
                    <option value="candlestick">Candlestick View</option>
                    <option value="heikin-ashi">Heikin-Ashi View</option>
                </select>

                <label>Auto Refresh:</label>
                <select id="refreshSelect">
                    <option value="0">Manual</option>
                    <option value="5000">Every 5 sec</option>
                    <option value="15000">Every 15 sec</option>
                    <option value="30000">Every 30 sec</option>
                    <option value="60000">Every 1 min</option>
                </select>
                
                <button class="btn-control btn-alert" id="alertBtn">🔔 Setup Alerts</button>
            </div>
        </div>
        
        <div class="grid" id="metricsGrid">
            <div class="card"><h3>Live Price</h3><p id="mPrice">--</p></div>
            <div class="card"><h3>NAV Discount</h3><p id="mDisc">--</p></div>
            <div class="card"><h3>Buy Score</h3><p id="mBuy">--</p></div>
            <div class="card"><h3>Active Tranches</h3><p id="mTranches">--</p></div>
            <div class="card"><h3>Macro Status</h3><p id="mMacro" style="font-size:13px">🟢 Stable</p></div>
        </div>
        
        <div class="chart-container">
            <canvas id="mainChart"></canvas>
        </div>
    </div>

    <script>
        let currentTicker = 'YCA.L';
        let chartInstance = null;
        let tickerDataStore = {};
        let refreshTimer = null;

        // Guaranteed locked dataset per ticker name
        function getLockedOHLC(ticker, count) {
            if (!tickerDataStore[ticker]) {
                let base = ticker === 'YCA.L' ? 550 : 320;
                let list = [];
                let now = new Date();
                for (let i = 500; i >= 0; i--) {
                    let d = new Date();
                    d.setDate(now.getDate() - i);
                    let change = Math.sin(i * 0.3) * 3 + Math.cos(i * 0.08) * 2;
                    let open = base;
                    let close = parseFloat((open + change).toFixed(2));
                    let high = parseFloat((Math.max(open, close) + 2).toFixed(2));
                    let low = parseFloat((Math.min(open, close) - 2).toFixed(2));
                    base = close;
                    list.push({ time: d.toISOString().split('T')[0], o: open, h: high, l: low, c: close });
                }
                tickerDataStore[ticker] = list;
            }
            let fullList = tickerDataStore[ticker];
            return fullList.slice(Math.max(fullList.length - count, 0));
        }

        function renderChart() {
            let tf = document.getElementById('timeframeSelect').value;
            let style = document.getElementById('styleSelect').value;
            
            const tfCountMap = { 'MAX': 400, '5Y': 300, '1Y': 180, '6M': 120, '1M': 30, '5D': 7, '1D': 2 };
            let count = tfCountMap[tf] || 30;

            let data = getLockedOHLC(currentTicker, count);
            let lastBar = data[data.length - 1];
            let lastPrice = lastBar.c;

            // Update Metrics (Consistent across view switches)
            document.getElementById('mPrice').innerText = (currentTicker === 'YCA.L') ? lastPrice + 'p' : '$' + lastPrice;
            document.getElementById('mDisc').innerText = (100 - (lastPrice / 634 * 100)).toFixed(2) + '%';
            document.getElementById('mBuy').innerText = Math.min(100, Math.max(0, (634 - lastPrice) * 1.2)).toFixed(1) + ' / 100';
            document.getElementById('mTranches').innerText = Math.floor(Math.min(100, Math.max(0, (634 - lastPrice) * 1.2)) / 20) + ' / 5';

            let labels = data.map(d => d.time);
            let prices = data.map(d => d.c);

            if (chartInstance) chartInstance.destroy();

            const ctx = document.getElementById('mainChart').getContext('2d');
            let isBar = style === 'bar';
            let isArea = style === 'area' || style === 'candlestick' || style === 'heikin-ashi';

            chartInstance = new Chart(ctx, {
                type: isBar ? 'bar' : 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${currentTicker} (${style.toUpperCase()})`,
                        data: prices,
                        borderColor: '#00d2ff',
                        backgroundColor: isArea ? 'rgba(0, 210, 255, 0.15)' : (isBar ? '#00d2ff' : 'transparent'),
                        borderWidth: 2,
                        fill: isArea,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#8a8a9e' } } },
                    scales: {
                        x: { ticks: { color: '#787e8e' }, grid: { color: '#262b36' } },
                        y: { ticks: { color: '#787e8e' }, grid: { color: '#262b36' } }
                    }
                }
            });
        }

        function selectStock(ticker, element) {
            currentTicker = ticker;
            document.getElementById('activeTitle').innerText = ticker + ' - Terminal View';
            document.querySelectorAll('.watchlist-item').forEach(el => el.classList.remove('active'));
            if(element) element.classList.add('active');
            renderChart();
        }

        function addTicker() {
            let input = document.getElementById('addTickerInput');
            let val = input.value.trim().toUpperCase();
            if(!val) return;
            
            let ul = document.getElementById('watchlistUI');
            let li = document.createElement('li');
            li.className = 'watchlist-item';
            li.setAttribute('data-symbol', val);
            li.innerHTML = `<span class="ticker">${val}</span><button class="btn-delete">✕</button>`;
            
            li.addEventListener('click', (e) => {
                if(!e.target.classList.contains('btn-delete')) selectStock(val, li);
            });
            
            li.querySelector('.btn-delete').addEventListener('click', (e) => {
                e.stopPropagation();
                li.remove();
            });

            ul.appendChild(li);
            input.value = '';
            selectStock(val, li);
        }

        document.getElementById('addBtn').addEventListener('click', addTicker);
        document.getElementById('addTickerInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTicker();
        });

        document.getElementById('timeframeSelect').addEventListener('change', renderChart);
        document.getElementById('styleSelect').addEventListener('change', renderChart);

        document.getElementById('refreshSelect').addEventListener('change', () => {
            if (refreshTimer) clearInterval(refreshTimer);
            let ms = parseInt(document.getElementById('refreshSelect').value);
            if (ms > 0) refreshTimer = setInterval(renderChart, ms);
        });

        document.getElementById('alertBtn').addEventListener('click', () => {
            let buyAlert = prompt(`Set BUY Price Floor Alert for ${currentTicker}:`, "520.00");
            let sellAlert = prompt(`Set SELL Price Ceiling Alert for ${currentTicker}:`, "620.00");
            if(buyAlert && sellAlert) {
                alert(`✅ Alerts Configured for ${currentTicker}!
• Buy Alert below: $${buyAlert}
• Sell Alert above: $${sellAlert}`);
            }
        });

        document.querySelector('.watchlist-item').addEventListener('click', function(e) {
            if(!e.target.classList.contains('btn-delete')) selectStock('YCA.L', this);
        });

        document.querySelector('.btn-delete').addEventListener('click', function(e) {
            e.stopPropagation();
            this.parentElement.remove();
        });

        window.onload = () => renderChart();
    </script>
</body>
</html>
