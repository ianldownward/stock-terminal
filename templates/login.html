<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | IDC TRADING</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0c10;
            background-image: url('/static/BG_Login.jpg?v=2');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
            color: #e1e3e6;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
}
        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 380px;
        }
        .login-logo {
            width: 175px;
            height: auto;
            max-height: 145px;
            object-fit: contain;
            margin-bottom: 58px;
            filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.75));
        }
        .auth-card {
            background: rgba(22, 25, 33, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            width: 100%;
            padding: 26px 22px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .tabs {
            display: flex;
            background: #101217;
            border-radius: 6px;
            padding: 3px;
            margin-bottom: 20px;
            border: 1px solid #262b36;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: #787e8e;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #1e222d;
            color: #ffd400;
        }
        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
        .input-group {
            margin-bottom: 14px;
            width: 100%;
        }
        .input-group label {
            display: block;
            font-size: 10px;
            color: #8a8a9e;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .input-group input {
            width: 100%;
            background: #ffffff;
            border: 1px solid #262b36;
            color: #0f1115;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #ffd400;
            box-shadow: 0 0 0 2px rgba(255, 212, 0, 0.25);
        }
        .btn-submit {
            width: 100%;
            background: #ffd400;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; }
        .error-msg {
            display: none;
            background: rgba(255, 61, 0, 0.15);
            border: 1px solid #ff5364;
            color: #ff5364;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <img src="/static/idc-trading-logo-stacked.svg?v=15" alt="IDC Trading" class="login-logo">

        <div class="auth-card">
            <div class="tabs">
                <button class="tab-btn active" id="loginTab" onclick="setMode('login')">Sign In</button>
                <button class="tab-btn" id="regTab" onclick="setMode('register')">Create Account</button>
            </div>

            <div class="error-msg" id="errMsg"></div>

            <form onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Email or Username</label>
                    <input type="text" id="username" placeholder="Enter username or email" required autocomplete="username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        let mode = 'login';
        function setMode(m) {
            mode = m;
            document.getElementById('loginTab').classList.toggle('active', m === 'login');
            document.getElementById('regTab').classList.toggle('active', m === 'register');
            document.getElementById('submitBtn').innerText = (m === 'login') ? 'Sign In' : 'Create Account';
            document.getElementById('errMsg').style.display = 'none';
        }

        async function handleAuth(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const errDiv = document.getElementById('errMsg');
            errDiv.style.display = 'none';

            const endpoint = (mode === 'login') ? '/api/auth/login' : '/api/auth/register';
            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const d = await res.json();
                if (d.status === 'ok') {
                    window.location.href = '/';
                } else {
                    errDiv.innerText = d.message || 'Authentication failed.';
                    errDiv.style.display = 'block';
                }
            } catch(err) {
                errDiv.innerText = 'Network error. Please try again.';
                errDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
